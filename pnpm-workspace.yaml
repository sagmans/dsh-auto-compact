packages: []
# The harness packages this plugin consumes are registry peers, so they and the
# peers of those peers must resolve here; without this every harness import in
# the tests would resolve to nothing.
autoInstallPeers: true
# Quarantine window for registry packages; the harness release line is younger
# than the window, so it is excluded and the lockfile pins what resolves. The
# 0.2.1-rc.2 line published its own dependency set inside the window, so those
# exact versions are named too; an exclusion never covers a later version, and
# the previous line's entries are dropped once nothing resolves them.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-*'
  - '@deepseek-ai/dsh@0.2.1-rc.2'
  - '@deepseek-ai/cordis@4.0.5'
  - '@deepseek-ai/cordis-plugin-group@1.0.5'
  - '@deepseek-ai/cordis-plugin-include@1.0.10'
  - '@deepseek-ai/cordis-plugin-loader@1.0.6'
  - '@deepseek-ai/cordis-plugin-timer@1.1.7'
  - '@deepseek-ai/cosmokit@1.8.6'
  - '@deepseek-ai/schemastery@3.18.5'
  - '@deepseek-ai/libreoffice-kit*'
  # The line's model adapter resolves this vendor release on a fresh install;
  # without it the dev tree would test against an older copy than hosts run.
  - '@earendil-works/pi-ai@1.3.0'
  - '@earendil-works/pi-telemetry@1.3.0'
allowBuilds:
  # Build steps the pinned toolchain needs: tsx transpiles through esbuild, and
  # the profile test drives @deepseek-ai/dsh, which loads a subprocess backend,
  # a native pty, and FFI. A dependency absent from this list stays blocked.
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
# Security floors for transitive dependencies the harness pulls in. Each entry
# only matches the vulnerable range, so a harness release that already ships the
# fix resolves untouched and the entry can be dropped then.
#   GHSA-6qxp-vccf-f47h  @modelcontextprotocol/sdk, @modelcontextprotocol/client
#   GHSA-jqcg-44mw-7w3h  proxy-addr
#   GHSA-ch52-4w7c-c8xp  http-cache-semantics
#   GHSA-wq5f-xc86-pv6w  sharp
overrides:
  '@modelcontextprotocol/client@<2.2.0': 2.2.0
  '@modelcontextprotocol/sdk@<1.31.0': ^1.31.0
  'proxy-addr@<2.0.8': ^2.0.8
  'http-cache-semantics@<4.2.1': ^4.2.1
  'sharp@<0.35.5': ^0.35.5
